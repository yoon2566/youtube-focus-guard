<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-bright": "#fcf9f0", "primary-fixed-dim": "#abcfb8", "on-secondary-container": "#52695e", "surface-container": "#f1eee5", "on-tertiary-fixed": "#291800", "tertiary-fixed-dim": "#feb956", "outline": "#727973", "inverse-surface": "#31312b", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#b3ccbf", "secondary-container": "#cee9da", "outline-variant": "#c1c8c2", "on-primary": "#ffffff", "tertiary-fixed": "#ffddb4", "inverse-primary": "#abcfb8", "primary-container": "#1b3b2b", "error": "#ba1a1a", "surface-container-high": "#ebe8df", "on-background": "#1c1c17", "on-secondary": "#ffffff", "on-primary-fixed": "#002113", "on-secondary-fixed": "#092017", "tertiary-container": "#4b2f00", "on-secondary-fixed-variant": "#354c41", "on-primary-container": "#83a590", "secondary-fixed": "#cee9da", "on-primary-fixed-variant": "#2d4d3c", "inverse-on-surface": "#f3f1e8", "surface-variant": "#e5e2da", "surface": "#fcf9f0", "on-tertiary-fixed-variant": "#633f00", "surface-container-highest": "#e5e2da", "surface-dim": "#dcdad1", "secondary": "#4c6358", "on-tertiary-container": "#d09131", "on-error": "#ffffff", "on-error-container": "#93000a", "tertiary": "#2f1c00", "on-surface-variant": "#424843", "primary-fixed": "#c7ebd4", "background": "#fcf9f0", "surface-container-low": "#f6f3ea", "on-surface": "#1c1c17", "primary": "#032517", "surface-tint": "#456553", "on-tertiary": "#ffffff" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "gutter": "1.5rem", "space-md": "1.25rem", "space-sm": "0.75rem", "space-lg": "2rem", "gutter-mobile": "1rem", "margin": "2.5rem", "space-xl": "3rem", "margin-mobile": "1.25re <!-- Subtle Ambient Glow & Forest Atmosphere Backdrop -->
<div class="absolute inset-0 pointer-events-none overflow-hidden -z-10">
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-80 h-80 rounded-full bg-secondary-container/30 blur-3xl"></div>
<div class="absolute top-44 -right-16 w-60 h-60 rounded-full bg-tertiary-fixed/30 blur-2xl"></div>
<div class="absolute top-80 -left-16 w-72 h-72 rounded-full bg-primary-fixed/20 blur-3xl"></div>
</div>
<!-- Header & Inspiring Headline Section -->
<header class="flex flex-col items-center text-center px-gutter-mobile pt-3 pb-2 relative z-10">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container/70 shadow-sm mb-3">
<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-label-sm text-label-sm text-secondary tracking-wide">집중의 숲</span>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-primary tracking-tight">
      오늘도 한 그루
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 max-w-[270px]">
      오늘도, 조금 더 성장하는<br/>나를 만나보세요.
    </p>
</header>
<!-- Central Garden Stage: Sprout & Earth Mound -->
<div class="relative w-full flex items-center justify-center my-1 px-4 z-10">
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Sunlight Halo Behind Tree -->
<div class="absolute inset-4 rounded-full bg-gradient-to-b from-surface-container-lowest/80 via-surface-container/60 to-transparent blur-md"></div>
<!-- Sprout & Floating Gentle Leaves (Illustration Asset Placeholder) -->
<div class="relative z-10 w-56 h-56 rounded-full overflow-hidden shadow-sm flex items-center justify-center">
<img class="w-full h-full object-cover transition-transform duration-700 hover:scale-105" data-alt="A delicate miniature green sprout with fresh dewdrops emerging from a soft mossy round soil mound surrounded by tiny white wild daisies, warm soft morning sunlight, muted gentle pastel watercolor aesthetic, dreamy forest background in soft sage green and warm cream, calming and restorative atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6948uz4tEjcePGOenJOgpK6bC90Rj29EAaVBSX2nIB38ZuRitU0LbyiUtpgVL3NKT1G0fUXb1TqVqUgqGvAMYKCBhQlsGQ7vEsAKq8e1V4EDFc-3cXB7yM22XBR3Oy_x_fC3MD7Y8myn-yp73Lwpv21eYFi7FucA1h_UpmaltXVBHoAQqbhzqgsMm9d0JPRn6bv0Lq4vK0Sf06pVlJe35fVpLERplpZRAokelVPO_FOi8bV1tlriB"/>
</div>
<!-- Tactile Clay Ground Shadow Accent -->
<div class="absolute -bottom-1 w-44 h-6 rounded-full bg-primary-container/10 blur-sm pointer-events-none"></div>
<!-- Ambient Floating Sprout Badge -->
<div class="absolute -top-1 right-6 bg-surface-container-lowest/90 backdrop-blur-md px-2.5 py-1 rounded-full shadow-sm flex items-center gap-1.5 animate-pulse">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-sm text-label-sm text-secondary font-medium">새싹 자라는 중</span>
</div>
</div>
</div>
<!-- Bottom Interactive Card Deck -->
<section class="flex flex-col gap-3 px-gutter-mobile mt-3 z-10 max-w-[390px] mx-auto w-full">
<!-- 1. Nickname Pill Bar -->
<div class="flex items-center justify-between bg-surface-container-low px-4 py-3 rounded-2xl shadow-sm transition-all active:scale-[0.99]" id="nicknameCard">
<div class="flex items-center gap-2.5 min-w-0">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[18px]">potted_plant</span>
</div>
<div class="flex items-baseline gap-1.5 truncate">
<span class="font-label-sm text-label-sm text-on-surface-variant shrink-0">닉네임</span>
<span class="font-label-md text-label-md text-on-surface font-semibold truncate" id="currentNickname">나무친구</span>
</div>
</div>
<button aria-label="닉네임 수정" class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container transition-colors" id="editNicknameBtn" type="button">
<span class="material-symbols-outlined text-[18px]">edit</span>
</button>
</div>
<!-- 2. Primary CTA: Solo Focus (Deep Forest Button) -->
<button class="group relative flex items-center justify-between w-full h-14 px-5 rounded-2xl bg-primary-container text-on-primary shadow-md hover:bg-primary transition-all duration-200 active:scale-[0.98]" type="button">
<div class="flex items-center gap-3">
<div class="w-7 h-7 rounded-full bg-secondary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-fixed text-[20px]" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<span class="font-label-lg text-label-lg font-semibold tracking-wide">혼자 하기</span>
</div>
<span class="material-symbols-outlined text-secondary-fixed-dim text-[20px] transition-transform duration-200 group-hover:translate-x-1">chevron_right</span>
</button>
<!-- 3. Secondary CTA: Create Room (Warm Forest Button) -->
<button class="group relative flex items-center justify-between w-full h-14 px-5 rounded-2xl bg-surface-container text-on-surface shadow-sm hover:bg-surface-container-high transition-all duration-200 active:scale-[0.98]" type="button">
<div class="flex items-center gap-3">
<div class="w-7 h-7 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<span class="font-label-lg text-label-lg font-semibold tracking-wide text-primary">방 만들기</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[20px] transition-transform duration-200 group-hover:translate-x-1">chevron_right</span>
</button>
<!-- 4. Tertiary Action: Join via Invite Code (Tactile Soft Card Button) -->
<button class="group relative flex items-center justify-between w-full h-14 px-5 rounded-2xl bg-surface-container-low text-on-surface-variant shadow-sm hover:bg-surface-container transition-all duration-200 active:scale-[0.98]" id="openInviteModalBtn" type="button">
<div class="flex items-center gap-3">
<div class="w-7 h-7 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">link</span>
</div>
<span class="font-label-lg text-label-lg font-semibold tracking-wide text-on-surface">초대코드로 참여</span>
</div>
<span class="material-symbols-outlined text-outline text-[20px] transition-transform duration-200 group-hover:translate-x-1">chevron_right</span>
</button>
</section>
<!-- Interactive Nickname Sheet / Dialog (Clay Modal Backdrop) -->
<div class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center px-4 pb-6 sm:pb-0 bg-primary/25 backdrop-blur-sm" id="nicknameModal">
<div class="w-full max-w-[360px] bg-surface-container-lowest rounded-3xl p-6 shadow-xl flex flex-col gap-4 animate-in fade-in duration-200">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[22px]">yard</span>
<h2 class="font-headline-md text-headline-md text-primary">닉네임 변경</h2>
</div>
<button class="text-outline hover:text-on-surface" id="closeNicknameModal" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        숲에서 친구들과 함께 사용할 다정한 이름을 입력해 주세요.
      </p>
<div class="relative w-full">
<input class="w-full h-12 px-4 rounded-xl bg-surface-container-low text-on-surface font-label-md text-label-md focus:bg-surface-container-lowest focus:outline-none transition-all shadow-inner" id="nicknameInput" maxlength="10" placeholder="예: 숲속다람쥐" type="text" value="나무친구"/>
<span class="absolute right-3.5 top-3.5 font-label-sm text-label-sm text-outline">10자 이내</span>
</div>
<div class="flex gap-2 pt-1">
<button class="flex-1 h-12 rounded-xl bg-surface-container text-on-surface font-label-md text-label-md" id="cancelNicknameBtn" type="button">
          취소
        </button>
<button class="flex-1 h-12 rounded-xl bg-primary-container text-on-primary font-label-md text-label-md shadow-sm" id="saveNicknameBtn" type="button">
          저장하기
        </button>
</div>
</div>
</div>
<!-- Interactive Invite Code Input Sheet -->
<div class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center px-4 pb-6 sm:pb-0 bg-primary/25 backdrop-blur-sm" id="inviteModal">
<div class="w-full max-w-[360px] bg-surface-container-lowest rounded-3xl p-6 shadow-xl flex flex-col gap-4 animate-in fade-in duration-200">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[22px]">key</span>
<h2 class="font-headline-md text-headline-md text-primary">초대코드 입력</h2>
</div>
<button class="text-outline hover:text-on-surface" id="closeInviteModal" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        친구가 공유해준 6자리 참여 코드를 입력하세요.
      </p>
<div class="relative w-full">
<input class="w-full h-12 px-4 rounded-xl bg-surface-container-low text-on-surface font-headline-md text-headline-md tracking-widest text-center uppercase focus:bg-surface-container-lowest focus:outline-none transition-all shadow-inner" id="inviteCodeInput" maxlength="6" placeholder="AB3K7M" type="text"/>
</div>
<div class="flex gap-2 pt-1">
<button class="flex-1 h-12 rounded-xl bg-surface-container text-on-surface font-label-md text-label-md" id="cancelInviteBtn" type="button">
          닫기
        </button>
<button class="flex-1 h-12 rounded-xl bg-primary-container text-on-primary font-label-md text-label-md shadow-sm" id="confirmInviteBtn" type="button">
          입장하기
        </button>
</div>
</div>
</div>
<!-- Micro-interaction Scripts -->
<script>
    (function() {
      // Nickname modal toggles
      const editBtn = document.getElementById('editNicknameBtn');
      const nicknameCard = document.getElementById('nicknameCard');
      const nicknameModal = document.getElementById('nicknameModal');
      const closeNickname = document.getElementById('closeNicknameModal');
      const cancelNickname = document.getElementById('cancelNicknameBtn');
      const saveNickname = document.getElementById('saveNicknameBtn');
      const nicknameInput = document.getElementById('nicknameInput');
      const currentNickname = document.getElementById('currentNickname');

      function openModal(el) { el.classList.remove('hidden'); }
      function closeModal(el) { el.classList.add('hidden'); }

      if (editBtn) editBtn.addEventListener('click', (e) => { e.stopPropagation(); openModal(nicknameModal); nicknameInput.focus(); });
      if (nicknameCard) nicknameCard.addEventListener('click', () => { openModal(nicknameModal); nicknameInput.focus(); });
      if (closeNickname) closeNickname.addEventListener('click', () => closeModal(nicknameModal));
      if (cancelNickname) cancelNickname.addEventListener('click', () => closeModal(nicknameModal));

      if (saveNickname) {
        saveNickname.addEventListener('click', () => {
          const val = nicknameInput.value.trim();
          if (val) {
            currentNickname.textContent = val;
          }
          closeModal(nicknameModal);
        });
      }

      // Invite code modal toggles
      const inviteBtn = document.getElementById('openInviteModalBtn');
      const inviteModal = document.getElementById('inviteModal');
      const closeInvite = document.getElementById('closeInviteModal');
      const cancelInvite = document.getElementById('cancelInviteBtn');
      const confirmInvite = document.getElementById('confirmInviteBtn');
      const inviteInput = document.getElementById('inviteCodeInput');

      if (inviteBtn) inviteBtn.addEventListener('click', () => { openModal(inviteModal); inviteInput.focus(); });
      if (closeInvite) closeInvite.addEventListener('click', () => closeModal(inviteModal));
      if (cancelInvite) cancelInvite.addEventListener('click', () => closeModal(inviteModal));

      if (confirmInvite) {
        confirmInvite.addEventListener('click', () => {
          if (inviteInput.value.trim().length > 0) {
            closeModal(inviteModal);
          }
        });
      }
    })();
  </script>
</div></main></body></html>
