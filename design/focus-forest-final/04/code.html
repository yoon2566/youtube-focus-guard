<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-bright": "#fcf9f0", "primary-fixed-dim": "#abcfb8", "on-secondary-container": "#52695e", "surface-container": "#f1eee5", "on-tertiary-fixed": "#291800", "tertiary-fixed-dim": "#feb956", "outline": "#727973", "inverse-surface": "#31312b", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#b3ccbf", "secondary-container": "#cee9da", "outline-variant": "#c1c8c2", "on-primary": "#ffffff", "tertiary-fixed": "#ffddb4", "inverse-primary": "#abcfb8", "primary-container": "#1b3b2b", "error": "#ba1a1a", "surface-container-high": "#ebe8df", "on-background": "#1c1c17", "on-secondary": "#ffffff", "on-primary-fixed": "#002113", "on-secondary-fixed": "#092017", "tertiary-container": "#4b2f00", "on-secondary-fixed-variant": "#354c41", "on-primary-container": "#83a590", "secondary-fixed": "#cee9da", "on-primary-fixed-variant": "#2d4d3c", "inverse-on-surface": "#f3f1e8", "surface-variant": "#e5e2da", "surface": "#fcf9f0", "on-tertiary-fixed-variant": "#633f00", "surface-container-highest": "#e5e2da", "surface-dim": "#dcdad1", "secondary": "#4c6358", "on-tertiary-container": "#d09131", "on-error": "#ffffff", "on-error-container": "#93000a", "tertiary": "#2f1c00", "on-surface-variant": "#424843", "primary-fixed": "#c7ebd4", "background": "#fcf9f0", "surface-container-low": "#f6f3ea", "on-surface": "#1c1c17", "primary": "#032517", "surface-tint": "#456553", "on-tertiary": "#ffffff" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "gutter": "1.5rem", "space-md": "1.25rem", "space-sm": "0.75rem", "space-lg": "2rem", "gutter-mobile": "1rem", "margin": "2.5rem", "space-xl": "3rem", "margin-mobile": "1.25rem", "space-xs": "0.375rem" }, "fontFamily": { "headline-xl": ["Plus Jakarta Sans"], "display-timer-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "display-timer": ["Plus Jakarta Sans"], "body-md": ["Noto Sans"], "body-lg": ["Noto Sans"], "label-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-sm": ["Noto Sans"], "headline-md": ["Noto Sans"], "headline-lg": ["Plus Jakarta Sans"] }, "fontSize": { "headline-xl": ["36px", { "lineHeight": "46px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "display-timer-mobile": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-xl-mobile": ["28px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "display-timer": ["84px", { "lineHeight": "96px", "letterSpacing": "-0.04em", "fontWeight": "700" }], "body-md": ["15px", { "lineHeight": "25px", "letterSpacing": "0em", "fontWeight": "400" }], "body-lg": ["17px", { "lineHeight": "28px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-lg": ["16px", { "lineHeight": "22px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["26px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="뒤로가기" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Active Tree Session</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin-mobile pt-14 pb-safe bg-surface"><div class="flex flex-col w-full pb-8">
<!-- Top Greeting & Header Stage -->
<div class="relative w-full overflow-hidden rounded-3xl bg-surface-container-low shadow-sm mb-5 p-6 flex flex-col items-center text-center">
<!-- Ambient organic glow background -->
<div class="absolute inset-0 bg-gradient-to-b from-secondary-container/30 via-surface-container-low/60 to-surface-container-low pointer-events-none"></div>
<!-- Sprout Icon Badge -->
<div class="relative z-10 w-11 h-11 rounded-full bg-secondary-container/80 flex items-center justify-center text-primary mb-3 shadow-inner">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<!-- Title & Subtitle -->
<h2 class="relative z-10 font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight mb-1.5">
      집중할 준비 됐나요?
    </h2>
<p class="relative z-10 font-body-sm text-body-sm text-secondary">
      좋은 소리와 함께, 더 깊이 집중해봐요.
    </p>
<!-- Growing Tree Stage Visual -->
<div class="relative z-10 w-full mt-4 flex flex-col items-center justify-center">
<div class="relative w-44 h-44 flex items-center justify-center">
<!-- Soft organic breathing circle -->
<div class="absolute w-36 h-36 rounded-full bg-secondary-container/40 blur-xl animate-pulse"></div>
<img class="relative z-10 w-40 h-40 object-contain drop-shadow-md select-none pointer-events-none" data-alt="A lush, detailed miniature young oak sapling growing peacefully atop a small mossy soil hillock dotted with tiny white wildflowers. Soft morning sun filtering through misty warm green forest air, painterly storybook aesthetic, gentle organic clay texture, tranquil and serene mood with sage green, warm amber and moss tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0-0Vx1Megnm_LDRxqH5hK4RJk3kIh7I2vfiRChgqsNVwXvfCaAEQ-nCyi9EwhjOz5eem0vu2q1a-sCLJbx4lTldaBVv5z-es7OouwHyHRYROQSVhBnDu9mRdIdwpOuAgIgBrbma2QUNSz3Xt75mXfsKaHd3KK3_5Py3AHuVy5nRGCO_DcmuOU4Gj5VOZh2M7AV6AgLc2IEeCKDoUK10sTiMX8AbjkuLIU_ZEnZHRLfXq1OIPdXitz"/>
</div>
<!-- Growth Status Badge -->
<div class="mt-1 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-secondary text-label-sm font-label-sm shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary-container animate-ping"></span>
<span>나무가 심어질 준비를 마쳤어요</span>
</div>
</div>
</div>
<!-- Sound Selector Card -->
<div class="w-full bg-surface-container-lowest rounded-3xl p-5 shadow-sm mb-4 flex flex-col">
<div class="flex items-center justify-between mb-3.5">
<span class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] text-secondary">graphic_eq</span>
        배경 소리 선택
      </span>
<span class="font-label-sm text-label-sm text-secondary" id="selected-sound-name">숲소리 선택됨</span>
</div>
<!-- Sound Options Grid -->
<div class="grid grid-cols-3 gap-2.5 mb-4">
<!-- Option 1: 빗소리 -->
<button class="sound-chip group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-surface-container-low transition-all duration-200 active:scale-95" id="btn-rain" onclick="selectSound('rain', '차분한 빗소리', '🌧️')" type="button">
<span class="text-2xl mb-1 select-none">🌧️</span>
<span class="font-label-md text-label-md text-on-surface">빗소리</span>
</button>
<!-- Option 2: 숲소리 (Default Active) -->
<button class="sound-chip active-chip group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-secondary-container text-primary-container shadow-sm transition-all duration-200 active:scale-95" id="btn-forest" onclick="selectSound('forest', '고요한 숲의 소리', '🌲')" type="button">
<div class="absolute -top-1 -right-1 w-4 h-4 bg-primary text-on-primary rounded-full flex items-center justify-center text-[10px] shadow">
<span class="material-symbols-outlined text-[11px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="text-2xl mb-1 select-none">🌲</span>
<span class="font-label-md text-label-md font-bold text-primary">숲소리</span>
</button>
<!-- Option 3: 명상 음악 -->
<button class="sound-chip group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-surface-container-low transition-all duration-200 active:scale-95" id="btn-meditation" onclick="selectSound('meditation', '평온한 싱잉볼 명상', '🎵')" type="button">
<span class="text-2xl mb-1 select-none">🎵</span>
<span class="font-label-md text-label-md text-on-surface">명상 음악</span>
</button>
</div>
<!-- Mini Audio Player & Volume Controller Box -->
<div class="w-full bg-surface-container-low rounded-2xl p-3.5 flex flex-col gap-3">
<!-- Player Header Row -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<button aria-label="소리 미리듣기 재생 또는 일시정지" class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md active:scale-90 transition-transform" id="play-pause-btn" onclick="togglePlay()" type="button">
<span class="material-symbols-outlined text-[22px]" id="play-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<div class="flex flex-col text-left">
<span class="font-label-md text-label-md text-on-surface" id="player-track-name">고요한 숲의 소리</span>
<span class="font-label-sm text-label-sm text-secondary">자연의 숨결과 잔잔한 바람</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-secondary bg-surface-container-high px-2 py-0.5 rounded-full">00:30 미리듣기</span>
</div>
<!-- Volume Slider Control -->
<div class="flex items-center gap-2.5 pt-1">
<button class="text-secondary hover:text-on-surface transition-colors" onclick="muteToggle()" type="button">
<span class="material-symbols-outlined text-[20px]" id="volume-icon">volume_up</span>
</button>
<div class="relative flex-1 flex items-center">
<input aria-label="음량 조절" class="w-full h-1.5 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary focus:outline-none" id="volume-slider" max="100" min="0" oninput="updateVolume(this.value)" type="range" value="65"/>
</div>
<span class="font-label-sm text-label-sm text-secondary w-7 text-right" id="volume-value">65%</span>
</div>
</div>
</div>
<!-- Keep Screen Awake Toggle Card -->
<div class="w-full bg-surface-container-lowest rounded-3xl p-5 shadow-sm mb-6 flex flex-col">
<div class="flex items-center justify-between gap-3">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-2xl bg-secondary-container/60 flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[22px]">stay_current_portrait</span>
</div>
<div class="flex flex-col text-left">
<span class="font-label-lg text-label-lg text-on-surface">화면 켜짐 유지</span>
<span class="font-body-sm text-body-sm text-secondary">집중하는 동안 디스플레이 유지</span>
</div>
</div>
<!-- Clay Styled Organic Toggle Switch -->
<button aria-checked="true" class="relative inline-flex h-8 w-14 shrink-0 cursor-pointer rounded-full bg-primary transition-colors duration-200 ease-in-out shadow-inner focus:outline-none" id="wake-lock-toggle" onclick="toggleWakeLock()" role="switch" type="button">
<span class="sr-only">화면 켜짐 유지 토글</span>
<span class="pointer-events-none inline-flex items-center justify-center h-6 w-6 transform translate-x-7 rounded-full bg-surface-container-lowest shadow-md transition duration-200 ease-in-out mt-1 ml-0.5 text-primary text-[14px]" id="toggle-dot">
<span class="material-symbols-outlined text-[13px]" style="font-variation-settings: 'FILL' 1;">eco</span>
</span>
</button>
</div>
<!-- System Notice Disclaimer -->
<div class="mt-3.5 pt-3 bg-surface-container-low/60 rounded-xl p-2.5 flex items-start gap-2">
<span class="material-symbols-outlined text-[16px] text-secondary shrink-0 mt-0.5">info</span>
<p class="font-body-sm text-body-sm text-secondary text-xs leading-relaxed">
        ※ 기기 및 브라우저 지원 여부에 따라 화면 유지를 요청하며, 기기 절전 설정에 따라 화면이 꺼질 수 있습니다 (항상 보장되지 않음).
      </p>
</div>
</div>
<!-- Primary Bottom Call To Action Button -->
<div class="w-full mt-auto">
<button class="group w-full h-16 rounded-full bg-primary text-on-primary flex items-center justify-center gap-2 font-label-lg text-label-lg shadow-lg active:scale-95 transition-all duration-150 hover:bg-primary-container" onclick="startSession()" type="button">
<span>함께 시작</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
<script>
  let isPlaying = true;
  let isWakeLockOn = true;
  let currentVolume = 65;

  function selectSound(type, name, emoji) {
    // Reset all chips
    const chips = document.querySelectorAll('.sound-chip');
    chips.forEach(chip => {
      chip.className = 'sound-chip group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-surface-container-low transition-all duration-200 active:scale-95';
      const checkBadge = chip.querySelector('.bg-primary');
      if (checkBadge) checkBadge.remove();
      const titleSpan = chip.querySelector('.font-label-md');
      if (titleSpan) {
        titleSpan.className = 'font-label-md text-label-md text-on-surface';
      }
    });

    // Activate target chip
    const activeChip = document.getElementById('btn-' + type);
    if (activeChip) {
      activeChip.className = 'sound-chip active-chip group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-secondary-container text-primary-container shadow-sm transition-all duration-200 active:scale-95';
      
      const badge = document.createElement('div');
      badge.className = 'absolute -top-1 -right-1 w-4 h-4 bg-primary text-on-primary rounded-full flex items-center justify-center text-[10px] shadow';
      badge.innerHTML = '<span class="material-symbols-outlined text-[11px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
      activeChip.appendChild(badge);

      const titleSpan = activeChip.querySelector('.font-label-md');
      if (titleSpan) {
        titleSpan.className = 'font-label-md text-label-md font-bold text-primary';
      }
    }

    document.getElementById('selected-sound-name').textContent = name + ' 선택됨';
    document.getElementById('player-track-name').textContent = name;
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    const icon = document.getElementById('play-icon');
    if (isPlaying) {
      icon.textContent = 'pause';
    } else {
      icon.textContent = 'play_arrow';
    }
  }

  function updateVolume(val) {
    currentVolume = val;
    document.getElementById('volume-value').textContent = val + '%';
    const volumeIcon = document.getElementById('volume-icon');
    if (val == 0) {
      volumeIcon.textContent = 'volume_off';
    } else if (val < 50) {
      volumeIcon.textContent = 'volume_down';
    } else {
      volumeIcon.textContent = 'volume_up';
    }
  }

  function muteToggle() {
    const slider = document.getElementById('volume-slider');
    if (slider.value > 0) {
      slider.value = 0;
      updateVolume(0);
    } else {
      slider.value = 65;
      updateVolume(65);
    }
  }

  function toggleWakeLock() {
    isWakeLockOn = !isWakeLockOn;
    const btn = document.getElementById('wake-lock-toggle');
    const dot = document.getElementById('toggle-dot');
    
    if (isWakeLockOn) {
      btn.setAttribute('aria-checked', 'true');
      btn.className = 'relative inline-flex h-8 w-14 shrink-0 cursor-pointer rounded-full bg-primary transition-colors duration-200 ease-in-out shadow-inner focus:outline-none';
      dot.className = 'pointer-events-none inline-flex items-center justify-center h-6 w-6 transform translate-x-7 rounded-full bg-surface-container-lowest shadow-md transition duration-200 ease-in-out mt-1 ml-0.5 text-primary text-[14px]';
    } else {
      btn.setAttribute('aria-checked', 'false');
      btn.className = 'relative inline-flex h-8 w-14 shrink-0 cursor-pointer rounded-full bg-surface-container-highest transition-colors duration-200 ease-in-out shadow-inner focus:outline-none';
      dot.className = 'pointer-events-none inline-flex items-center justify-center h-6 w-6 transform translate-x-1 rounded-full bg-surface-container-lowest shadow-md transition duration-200 ease-in-out mt-1 ml-0.5 text-outline text-[14px]';
    }
  }

  function startSession() {
    // Delighted subtle interaction before forward progression
    const btn = event.currentTarget;
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
      // Next flow action
    }, 150);
  }
</script></main></body></html>
