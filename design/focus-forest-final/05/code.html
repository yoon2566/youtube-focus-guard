<script>
  (function() {
    // Subtle realistic count-down simulation for immersion
    let totalSeconds = 18 * 60 + 42;
    const timerEl = document.getElementById('display-time');
    
    if (timerEl) {
      setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          const m = Math.floor(totalSeconds / 60);
          const s = totalSeconds % 60;
          timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
      }, 1000);
    }

    // Sound toggle state
    const soundBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');
    let isPlaying = true;

    if (soundBtn && soundIcon) {
      soundBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        soundIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }

    // Calm exit confirm
    const abortBtn = document.getElementById('abort-btn');
    if (abortBtn) {
      abortBtn.addEventListener('click', () => {
        if (confirm('지금 종료하면 자라던 나무가 성장을 멈춰요. 그래도 집중을 마칠까요?')) {
          history.back();
        }
      });
    }
  })();
