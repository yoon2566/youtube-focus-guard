<!-- Subtle ambient forest vibe backdrop card -->

<div class="absolute inset-0 bg-gradient-to-t from-primary-container/60 via-transparent to-transparent flex items-end p-space-sm">

</span>

<!-- Header Description -->
<div class="text-center px-space-xs pt-1">

</div>
</div>
<!-- Focus Preset Selection Grid -->
<section aria-labelledby="time-selection-heading" class="w-full mb-space-md">
<div class="flex items-center justify-between px-1 mb-2">
<h3 class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" id="time-selection-heading">
<span class="material-symbols-outlined text-[18px] text-secondary">schedule</span>
        집중 시간 선택
      </h3>
<span class="font-label-sm text-label-sm text-secondary">언제든 연장 가능해요</span>
</div>
<!-- Time Preset Cards Grid -->
<div class="grid grid-cols-2 gap-space-sm" id="timeGrid">
<!-- 1 Min Trial -->
<button class="preset-card text-left p-space-sm rounded-DEFAULT bg-surface-container transition-all duration-200 active:scale-95 shadow-[0_2px_8px_rgba(27,59,43,0.04)]" data-time="1" onclick="selectPreset(this, 1)" type="button">
<div class="flex items-center justify-between mb-1.5">
<span class="px-2 py-0.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-sm text-label-sm">맛보기</span>
<span class="material-symbols-outlined text-outline-variant check-icon text-[20px]">radio_button_unchecked</span>
</div>
<div class="font-headline-md text-headline-md text-on-surface">1분 체험</div>
<p class="font-body-sm text-body-sm text-secondary line-clamp-1 mt-0.5">빠른 앱 기능 둘러보기</p>
</button>
<!-- 10 Min -->
<button class="preset-card text-left p-space-sm rounded-DEFAULT bg-surface-container transition-all duration-200 active:scale-95 shadow-[0_2px_8px_rgba(27,59,43,0.04)]" data-time="10" onclick="selectPreset(this, 10)" type="button">
<div class="flex items-center justify-between mb-1.5">
<span class="px-2 py-0.5 rounded-full bg-surface-variant text-on-surface-variant font-label-sm text-label-sm">가벼운 시작</span>
<span class="material-symbols-outlined text-outline-variant check-icon text-[20px]">radio_button_unchecked</span>
</div>
<div class="font-headline-md text-headline-md text-on-surface">10분</div>
<p class="font-body-sm text-body-sm text-secondary line-clamp-1 mt-0.5">휴식 후 워밍업 몰입</p>
</button>
<!-- 25 Min (Default Pomodoro Recommendation) -->
<button class="preset-card selected-card text-left p-space-sm rounded-DEFAULT bg-secondary-container transition-all duration-200 active:scale-95 shadow-[0_4px_14px_rgba(27,59,43,0.12)]" data-time="25" onclick="selectPreset(this, 25)" type="button">
<div class="flex items-center justify-between mb-1.5">
<span class="px-2 py-0.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm flex items-center gap-0.5">
<span class="material-symbols-outlined text-[13px]" style="font-variation-settings: 'FILL' 1;">star</span>
            추천
          </span>
<span class="material-symbols-outlined text-primary check-icon text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="font-headline-md text-headline-md text-on-surface">25분</div>
<p class="font-body-sm text-body-sm text-on-secondary-container line-clamp-1 mt-0.5">뽀모도로 황금 몰입</p>
</button>
<!-- 50 Min -->
<button class="preset-card text-left p-space-sm rounded-DEFAULT bg-surface-container transition-all duration-200 active:scale-95 shadow-[0_2px_8px_rgba(27,59,43,0.04)]" data-time="50" onclick="selectPreset(this, 50)" type="button">
<div class="flex items-center justify-between mb-1.5">
<span class="px-2 py-0.5 rounded-full bg-surface-variant text-on-surface-variant font-label-sm text-label-sm">딥워크</span>
<span class="material-symbols-outlined text-outline-variant check-icon text-[20px]">radio_button_unchecked</span>
</div>
<div class="font-headline-md text-headline-md text-on-surface">50분</div>
<p class="font-body-sm text-body-sm text-secondary line-clamp-1 mt-0.5">깊은 사고와 과제 완성</p>
</button>
</div>
</section>
<!-- Goal Input Section -->
<section class="w-full bg-surface-container-lowest rounded-DEFAULT p-space-md shadow-[0_4px_20px_-2px_rgba(27,59,43,0.05)] mb-space-md">
<div class="flex items-center justify-between mb-2">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="goal-input">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">nature_people</span>
        오늘 심을 나무의 다짐
      </label>
<span class="font-label-sm text-label-sm text-outline" id="charCount">0/30</span>
</div>
<!-- Soft recessed input container -->
<div class="relative w-full rounded-full bg-surface-container-low shadow-[inset_0_2px_4px_rgba(20,40,29,0.05)] flex items-center px-4 py-3 focus-within:bg-surface-bright focus-within:shadow-[0_0_0_2px_#feb956] transition-all duration-200">
<span class="material-symbols-outlined text-outline-variant text-[20px] mr-2">edit_note</span>
<input class="w-full bg-transparent border-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-sm" id="goal-input" maxlength="30" oninput="handleGoalInput(this)" placeholder="예: 기획서 초안 작성, 인문학 서적 30p 읽기" type="text"/>
<button aria-label="입력 지우기" class="hidden text-outline hover:text-on-surface p-1 rounded-full transition-colors" id="clearBtn" onclick="clearGoal()" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
<!-- Quick suggestion tags -->
<div class="flex items-center gap-1.5 mt-3 overflow-x-auto pb-1">
<span class="font-label-sm text-label-sm text-secondary whitespace-nowrap">추천 다짐:</span>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-secondary-container transition-colors whitespace-nowrap" onclick="setGoal('기획서 핵심 초안 완성')" type="button">기획서 작성</button>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-secondary-container transition-colors whitespace-nowrap" onclick="setGoal('독서 30페이지')" type="button">책 30p 읽기</button>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm hover:bg-secondary-container transition-colors whitespace-nowrap" onclick="setGoal('코딩 알고리즘 2문제 풀기')" type="button">알고리즘 풀이</button>
</div>
</section>
<!-- Forest Philosophy Warm Notice -->
<div class="flex items-start gap-2.5 px-3 py-3 rounded-DEFAULT bg-surface-container-high/60 mb-space-lg text-secondary">
<span class="material-symbols-outlined text-[20px] text-secondary mt-0.5 shrink-0" style="font-variation-settings: 'FILL' 1;">self_improvement</span>
<p class="font-body-sm text-body-sm leading-snug">
      다른 앱의 실행 자체를 차단하지 않으며, 스스로의 약속으로 숲을 가꿉니다. 온전한 나만의 시간을 존중해요.
    </p>
</div>
<!-- Bottom Action Section -->
<div class="w-full flex flex-col gap-2">
<!-- Primary Start Button -->
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary flex items-center justify-between px-6 shadow-[0_8px_24px_-4px_rgba(27,59,43,0.28),0_2px_6px_-1px_rgba(27,59,43,0.16)] transition-all duration-200 hover:-translate-y-0.5 active:scale-98 active:shadow-md" id="submitBtn" onclick="proceedNext()" type="button">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">forest</span>
<span class="font-label-lg text-label-lg" id="btnLabel">25분 집중 준비하기</span>
</div>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="flex items-center justify-center gap-1.5 pt-1">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-label-sm text-label-sm text-secondary">혼자 또는 친구를 초대해 함께 시작할 수 있어요</span>
</div>
</div>
</div>
<script>
  let selectedDuration = 25;

  function selectPreset(btnElement, duration) {
    selectedDuration = duration;
    
    // Reset all cards
    const cards = document.querySelectorAll('.preset-card');
    cards.forEach(card => {
      card.classList.remove('bg-secondary-container', 'shadow-[0_4px_14px_rgba(27,59,43,0.12)]');
      card.classList.add('bg-surface-container', 'shadow-[0_2px_8px_rgba(27,59,43,0.04)]');
      
      const icon = card.querySelector('.check-icon');
      if (icon) {
        icon.textContent = 'radio_button_unchecked';
        icon.classList.remove('text-primary');
        icon.classList.add('text-outline-variant');
        icon.style.fontVariationSettings = "'FILL' 0";
      }
    });

    // Highlight selected card
    btnElement.classList.remove('bg-surface-container', 'shadow-[0_2px_8px_rgba(27,59,43,0.04)]');
    btnElement.classList.add('bg-secondary-container', 'shadow-[0_4px_14px_rgba(27,59,43,0.12)]');
    
    const activeIcon = btnElement.querySelector('.check-icon');
    if (activeIcon) {
      activeIcon.textContent = 'check_circle';
      activeIcon.classList.remove('text-outline-variant');
      activeIcon.classList.add('text-primary');
      activeIcon.style.fontVariationSettings = "'FILL' 1";
    }

    // Update button text
    const btnLabel = document.getElementById('btnLabel');
    if (btnLabel) {
      btnLabel.textContent = `${duration}분 집중 준비하기`;
    }
  }

  function handleGoalInput(input) {
    const charCount = document.getElementById('charCount');
    const clearBtn = document.getElementById('clearBtn');
    
    if (charCount) {
      charCount.textContent = `${input.value.length}/30`;
    }
    
    if (clearBtn) {
      if (input.value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }
  }

  function clearGoal() {
    const input = document.getElementById('goal-input');
    if (input) {
      input.value = '';
      handleGoalInput(input);
      input.focus();
    }
  }

  function setGoal(text) {
    const input = document.getElementById('goal-input');
    if (input) {
      input.value = text;
      handleGoalInput(input);
      input.focus();
    }
  }

  function proceedNext() {
    const input = document.getElementById('goal-input');
    const goalText = input ? input.value.trim() : '';
    // Provide tactile feedback before navigating
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.classList.add('scale-95');
      setTimeout(() => {
        submitBtn.classList.remove('scale-95');
        // Gentle confirmation simulation
        alert(`🌲 ${selectedDuration}분 몰입 설정이 완료되었습니다!\n다짐: "${goalText || '조용한 나만의 몰입'}"`);
      }, 150);
    }
  }
</script></main></body></html>
