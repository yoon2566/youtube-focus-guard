name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle*'
      - 'gradle.properties'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test target matching
        run: |
          mkdir -p /tmp/policy-test
          javac -encoding UTF-8 -d /tmp/policy-test app/src/main/java/kr/yoon/focusguard/BlockPolicy.java tests/BlockPolicyTest.java
          java -cp /tmp/policy-test kr.yoon.focusguard.BlockPolicyTest
      - name: Build and lint
        run: bash gradlew assembleDebug lintDebug --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-focus-guard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
